<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificateur de Voyage</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.vy-root, .vy-root * { box-sizing: border-box; }
.vy-root {
  --paper: #F6F1E3;
  --paper-dim: #ECE3CC;
  --paper-card: #FBF8F0;
  --ink: #24272E;
  --ink-soft: #676C78;
  --ink-faint: #9A9B90;
  --vermilion: #C1401F;
  --vermilion-dark: #93301A;
  --kraft: #B99A6B;
  --transit: #3E6E6C;
  --transit-dark: #2C4F4E;
  --line: #D9CDA8;
  --success: #4B7A4B;
  --danger: #B23A2E;
  --warning: #D97706;
  --shadow: 0 1px 2px rgba(36,39,46,.08), 0 4px 14px rgba(36,39,46,.06);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: stretch;
  position: relative;
}
.vy-root a { color: inherit; }
.vy-root button { font-family: var(--font-body); cursor: pointer; }


/* ---------- Sidebar (passport stamps) ---------- */
.vy-sidebar {
  width: 210px;
  flex-shrink: 0;
  background: var(--paper-dim);
  border-right: 1px solid var(--line);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.vy-brand {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: .01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.vy-brand-mark {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px dashed var(--vermilion);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--vermilion); transform: rotate(-8deg);
}
.vy-triplist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.vy-tripstamp {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px; border-radius: 4px; border: 1px solid transparent;
  background: transparent; text-align: left; width: 100%;
}
.vy-tripstamp:hover { background: rgba(193,64,31,.06); }
.vy-tripstamp.active { background: var(--paper-card); border-color: var(--vermilion); box-shadow: var(--shadow); }
.vy-stampcircle {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  border: 2px dashed var(--kraft);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  color: var(--transit-dark); transform: rotate(-6deg);
  background: repeating-radial-gradient(circle, transparent 0 2px, rgba(185,154,107,.08) 2px 3px);
}
.vy-tripstamp.active .vy-stampcircle { border-color: var(--vermilion); color: var(--vermilion-dark); }
.vy-tripname { font-size: 13px; font-weight: 600; line-height: 1.2; }
.vy-tripdates { font-size: 10.5px; color: var(--ink-soft); font-family: var(--font-mono); }
.vy-newtrip-btn {
  border: 1.5px dashed var(--ink-faint); background: transparent; border-radius: 4px;
  padding: 9px 10px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
  display: flex; align-items: center; gap: 6px; justify-content: center;
}
.vy-newtrip-btn:hover { border-color: var(--vermilion); color: var(--vermilion-dark); }

/* ---------- Main ---------- */
.vy-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vy-empty { margin: auto; text-align: center; padding: 40px; max-width: 380px; }
.vy-empty h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 8px; }
.vy-empty p { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; }

/* Boarding pass header */
.vy-boardingpass {
  margin: 18px 20px 0;
  background: var(--ink);
  color: var(--paper);
  border-radius: 6px;
  display: flex;
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;
}
.vy-bp-main { flex: 1; padding: 18px 22px; min-width: 0; }
.vy-bp-eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--kraft); margin-bottom: 6px; }
.vy-bp-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 0 0 4px; display:flex; align-items:baseline; gap:10px; }
.vy-bp-title .vy-editbtn { font-size: 11px; font-family: var(--font-body); text-transform: none; letter-spacing: 0; color: var(--kraft); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; padding: 3px 10px; font-weight: 600; background: transparent; }
.vy-bp-sub { font-family: var(--font-mono); font-size: 12px; color: rgba(246,241,227,.7); }
.vy-bp-divider {
  width: 0; border-left: 2px dashed rgba(246,241,227,.3); position: relative; flex-shrink: 0;
}
.vy-bp-divider::before, .vy-bp-divider::after {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%);
  width: 22px; height: 22px; border-radius: 50%; background: var(--paper);
}
.vy-bp-divider::before { top: -11px; } .vy-bp-divider::after { bottom: -11px; }
.vy-bp-stub { width: 168px; flex-shrink: 0; padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.vy-bp-count { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--vermilion); line-height: 1; }
.vy-bp-countlabel { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: rgba(246,241,227,.65); margin-top: 4px; }

/* Tabs */
.vy-tabs { display: flex; gap: 2px; margin: 16px 20px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.vy-tab {
  background: transparent; border: none; padding: 10px 14px 12px; font-size: 12.5px; font-weight: 600;
  color: var(--ink-soft); border-bottom: 2px solid transparent; white-space: nowrap; letter-spacing: .01em;
}
.vy-tab.active { color: var(--vermilion-dark); border-bottom-color: var(--vermilion); }
.vy-tab:hover:not(.active) { color: var(--ink); }

.vy-content { padding: 20px; flex: 1; overflow-y: auto; }
.vy-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.vy-section-head h3 { font-family: var(--font-display); font-size: 19px; margin: 0; font-weight: 600; }
.vy-section-head p { color: var(--ink-soft); font-size: 12px; margin: 2px 0 0; }

.vy-btn {
  background: var(--vermilion); color: var(--paper); border: none; border-radius: 4px;
  padding: 8px 14px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.vy-btn:hover { background: var(--vermilion-dark); }
.vy-btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.vy-btn.secondary:hover { border-color: var(--ink-faint); }
.vy-btn.ghost { background: transparent; color: var(--ink-soft); padding: 4px 8px; font-weight: 600; }
.vy-btn.danger { background: transparent; color: var(--danger); }
.vy-btn.small { padding: 4px 9px; font-size: 11.5px; }
.vy-iconbtn { background: transparent; border: none; color: var(--ink-faint); padding: 3px 5px; font-size: 13px; border-radius: 3px; }
.vy-iconbtn:hover { color: var(--vermilion-dark); background: rgba(193,64,31,.08); }

.vy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.vy-empty-hint { border: 1.5px dashed var(--line); border-radius: 6px; padding: 26px; text-align: center; color: var(--ink-soft); font-size: 12.5px; }

/* Overview stats */
.vy-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap: 10px; margin-bottom: 24px; }
.vy-stat {
  background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
  cursor: pointer; transition: border-color .15s, box-shadow .15s; text-align: left;
}
.vy-stat:hover { border-color: var(--vermilion); box-shadow: 0 0 0 3px rgba(193,64,31,.1); }
.vy-stat .n { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--vermilion-dark); }
.vy-stat .l { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

/* Day grid */
.vy-day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap: 8px; margin-bottom: 20px; }
.vy-day-btn {
  background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 8px; text-align: center; cursor: pointer; transition: border-color .15s, box-shadow .15s;
  font-family: var(--font-body);
}
.vy-day-btn:hover { border-color: var(--kraft); }
.vy-day-btn.active { border-color: var(--vermilion); box-shadow: 0 0 0 3px rgba(193,64,31,.12); background: var(--paper); }
.vy-day-btn.past { opacity: .42; filter: grayscale(.6); }
.vy-day-btn .d-num { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1; }
.vy-day-btn .d-label { font-size: 10px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vy-day-btn .d-steps { margin-top: 4px; display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; }
.vy-day-btn .d-dot { width: 6px; height: 6px; border-radius: 50%; }
.vy-day-btn.active .d-num { color: var(--vermilion-dark); }

/* Day detail panel */
.vy-day-detail { background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin-bottom: 20px; }
.vy-day-detail h4 { font-family: var(--font-display); font-size: 16px; margin: 0 0 2px; }
.vy-day-detail .dt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 12px; display: block; }
.vy-day-detail .vy-day-notes { margin-bottom: 10px; }

/* Trash button */
.vy-trash-wrap { margin-top: 32px; display: flex; justify-content: flex-end; }
.vy-trash-btn {
  display: flex; align-items: center; gap: 6px; background: transparent; border: none;
  color: var(--ink-faint); font-size: 11px; font-family: var(--font-body); padding: 4px 8px;
  border-radius: 4px; cursor: pointer; transition: color .15s;
}
.vy-trash-btn:hover { color: var(--danger); }

/* Ticket-stub card (flights & transport) */
.vy-ticket {
  background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow); overflow: hidden; position: relative;
}
.vy-ticket-body { padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
.vy-ticket-route { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.vy-ticket-pt { min-width: 0; }
.vy-ticket-pt .city { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.vy-ticket-pt .time { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }
.vy-ticket-arrow { color: var(--kraft); font-size: 16px; flex-shrink: 0; }
.vy-ticket-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft); padding: 0 16px 12px; display:flex; gap:14px; flex-wrap:wrap; }
.vy-ticket-tag { display:inline-block; font-family: var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; background: var(--transit); color: var(--paper); padding: 2px 7px; border-radius: 20px; }
.vy-ticket-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
.vy-ticket::after {
  content: ''; position: absolute; left: 0; right: 0; top: 46px; border-top: 1.5px dashed var(--line);
}

/* Hotel card */
.vy-hotel { background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 14px 16px; position: relative; }
.vy-hotel h4 { font-family: var(--font-display); font-size: 16px; margin: 0 0 4px; padding-right: 40px; }
.vy-hotel .addr { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
.vy-hotel .dates { font-family: var(--font-mono); font-size: 11.5px; display: flex; gap: 12px; }
.vy-hotel .nights { display:inline-block; background: var(--kraft); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-family: var(--font-mono); margin-left: 8px; }
.vy-hotel .conf { margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--transit-dark); }

/* Places list */
.vy-place-row { display: flex; align-items: flex-start; gap: 10px; background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.vy-place-cat { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; margin-top: 2px; }
.vy-map-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.vy-legend-pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  color: var(--ink-faint); background: var(--paper-card); border: 1px solid var(--line);
  border-radius: 20px; padding: 5px 11px 5px 8px; opacity: .55; transition: opacity .15s ease, border-color .15s ease;
}
.vy-legend-pill.active { opacity: 1; border-color: var(--pill-color); color: var(--ink); }
.vy-legend-pill:hover { opacity: .85; }
.vy-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.vy-place-row { cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease; }
.vy-place-row.selected { border-color: var(--vermilion); box-shadow: 0 0 0 2px rgba(193,64,31,.15); }
.vy-place-row:hover { border-color: var(--ink-faint); }
.vy-place-name { font-weight: 600; font-size: 13.5px; }
.vy-place-notes { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.vy-place-coords { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 3px; }

/* Days / itinerary */
.vy-day { background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
.vy-day-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--paper-dim); }
.vy-day-head .lbl { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.vy-day-head .dt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
.vy-day-body { padding: 12px 14px; }
.vy-day-notes { font-size: 12px; color: var(--ink-soft); font-style: italic; margin-bottom: 8px; }
.vy-step { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dotted var(--line); font-size: 13px; }
.vy-step:last-child { border-bottom: none; }
.vy-step .stepnum { font-family: var(--font-mono); font-size: 10.5px; color: var(--kraft); width: 16px; flex-shrink: 0; }
.vy-step .steptype { font-size: 12px; flex-shrink: 0; }
.vy-step .stepcontent { flex: 1; min-width: 0; }
.vy-step .stepsub { font-size: 10.5px; color: var(--ink-soft); font-family: var(--font-mono); }
.vy-step-actions { display: flex; gap: 0; flex-shrink: 0; }

/* Checklist */
.vy-checklist-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 720px) { .vy-checklist-cols { grid-template-columns: 1fr; } }
.vy-checklist-col h4 { font-family: var(--font-display); font-size: 15.5px; margin: 0 0 8px; }
.vy-progress { height: 6px; background: var(--paper-dim); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.vy-progress > div { height: 100%; background: var(--vermilion); }

.vy-budget-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
.vy-budget-row { display: grid; grid-template-columns: 170px 1fr 90px; align-items: center; gap: 12px; }
.vy-budget-row-label { font-size: 12.5px; color: var(--ink-soft); }
.vy-budget-row-bar { height: 10px; background: var(--paper-dim); border-radius: 5px; overflow: hidden; }
.vy-budget-row-bar > div { height: 100%; border-radius: 5px; transition: width .3s ease; }
.vy-budget-row-amount { font-family: var(--font-mono); font-size: 12.5px; text-align: right; font-weight: 600; }
@media (max-width: 640px){
  .vy-budget-row { grid-template-columns: 110px 1fr 70px; gap: 8px; }
  .vy-budget-row-label { font-size: 11px; }
}

.vy-expense-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.vy-expense-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.vy-expense-row:hover { background: var(--paper-dim); }
.vy-expense-cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.vy-expense-main { flex: 1; min-width: 0; }
.vy-expense-label { font-size: 13px; font-weight: 600; color: var(--ink); }
.vy-expense-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vy-expense-amount { font-family: var(--font-mono); font-weight: 700; color: var(--vermilion-dark); font-size: 13px; white-space: nowrap; }
.vy-expense-actions { display: flex; gap: 4px; flex-shrink: 0; }
@media (max-width: 640px){
  .vy-expense-sub { white-space: normal; }
}
.vy-check-item { display: flex; align-items: center; gap: 9px; padding: 7px 2px; border-bottom: 1px dotted var(--line); font-size: 13px; }
.vy-check-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--vermilion); flex-shrink:0; }
.vy-check-item.done .txt { text-decoration: line-through; color: var(--ink-faint); }
.vy-check-item .txt { flex: 1; }
.vy-checkform { display: flex; gap: 6px; margin-top: 10px; }

/* Map tab */
.vy-map-layout { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) { .vy-map-layout { grid-template-columns: 1fr; } }
#vy-leaflet-map { height: 520px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper-dim); }
.vy-map-side { max-height: 560px; overflow-y: auto; }

/* Dialog */
.vy-root dialog.vy-dialog {
  border: none; border-radius: 12px; padding: 0;
  width: 540px; max-width: 95vw;
  box-shadow: 0 20px 60px rgba(36,39,46,.28), 0 4px 12px rgba(36,39,46,.12);
  background: var(--paper);
}
.vy-root dialog.vy-dialog::backdrop { background: rgba(36,39,46,.55); backdrop-filter: blur(2px); }
.vy-dialog-head {
  padding: 20px 24px 16px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--ink); border-radius: 12px 12px 0 0;
}
.vy-dialog-head h4 { font-family: var(--font-display); font-size: 18px; margin: 0; color: var(--paper); font-weight: 600; }
.vy-close-x {
  background: rgba(255,255,255,.1); border: none; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: rgba(246,241,227,.8); cursor: pointer; line-height: 1;
}
.vy-close-x:hover { background: rgba(255,255,255,.2); color: var(--paper); }
.vy-dialog-body { padding: 0; max-height: 68vh; overflow-y: auto; }
.vy-dialog-foot {
  padding: 16px 24px; display: flex; justify-content: flex-end; gap: 8px;
  border-top: 1px solid var(--line); background: var(--paper-dim); border-radius: 0 0 12px 12px;
}

/* Form sections */
.vy-dialog-section {
  padding: 18px 24px 16px; border-bottom: 1px solid var(--line);
}
.vy-dialog-section:last-child { border-bottom: none; }
.vy-dialog-section-title {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--kraft); font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.vy-dialog-section-title::after { content:''; flex:1; height:1px; background: var(--line); }
.vy-date-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vy-date-pair .vy-field { margin-bottom: 0; }

/* Improved field layout */
.vy-field { margin-bottom: 14px; }
.vy-field:last-child { margin-bottom: 0; }
.vy-root label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-soft); font-weight: 700; display: block; margin-bottom: 5px;
}
.vy-root input, .vy-root select, .vy-root textarea {
  font-family: var(--font-body); font-size: 13.5px;
  background: var(--paper-card); border: 1.5px solid var(--line);
  border-radius: 5px; padding: 9px 12px; color: var(--ink); width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
.vy-root input:focus, .vy-root select:focus, .vy-root textarea:focus {
  outline: none; border-color: var(--vermilion); box-shadow: 0 0 0 3px rgba(193,64,31,.1);
}
.vy-root input::placeholder { color: var(--ink-faint); }
.vy-input-icon-wrap { position: relative; }
.vy-input-icon-wrap input { padding-left: 34px; }
.vy-input-icon-wrap .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }

.vy-status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; transition: background-color .3s ease; flex-shrink: 0; }
.vy-status-dot.green { background-color: var(--success); box-shadow: 0 0 6px var(--success); }
.vy-status-dot.orange { background-color: var(--warning); box-shadow: 0 0 6px var(--warning); }
.vy-status-dot.red { background-color: var(--danger); box-shadow: 0 0 6px var(--danger); }
.vy-save-menu-btn { background: transparent; border: none; font-size: 14px; padding: 2px 6px; color: var(--ink-soft); border-radius: 4px; }
.vy-save-menu-btn:hover { background: rgba(0,0,0,.06); color: var(--ink); }
.vy-save-dropdown {
  position: absolute; top: 100%; right: 0; margin-top: 6px; background: var(--paper-card);
  border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  z-index: 1000; display: none; min-width: 210px; overflow: hidden;
}
.vy-save-dropdown.show { display: block; }
.vy-save-dropdown button {
  width: 100%; text-align: left; background: transparent; border: none; padding: 10px 14px;
  font-size: 12.5px; color: var(--ink); display: flex; align-items: center; gap: 8px;
}
.vy-save-dropdown button:hover { background: var(--paper-dim); }

/* ---------- Mobile hamburger + drawer (desktop untouched above) ---------- */
.vy-hamburger-btn { display: none; }
.vy-sidebar-backdrop { display: none; }

@media (max-width: 860px) {
  html, body { overflow-x: hidden; max-width: 100%; }
  .vy-root { overflow-x: hidden; }

  /* Hamburger toggle button, shown in the top header on mobile */
  .vy-hamburger-btn {
    display: flex; align-items: center; justify-content: center;

  /* Sidebar becomes an off-canvas drawer */

    transform: translateX(-100%);
    transition: transform .25s ease;

  /* Main takes the full width; sidebar floats above it */

  /* Top header */

  .vy-save-status-container { margin-left: 0; flex: 1; justify-content: space-between; }

  /* Form / content grids collapse to one column */
  .vy-row, .vy-row.thirds, .vy-row.two-one,
  .vy-date-pair,
  .vy-checklist-cols,
  .vy-map-layout { grid-template-columns: 1fr !important; }

  /* Tickets wrap instead of squeezing */

  /* Dialogs become near full-screen sheets for comfortable typing */
  .vy-root dialog.vy-dialog {
    width: 100vw; max-width: 100vw;

  /* Bigger touch targets */

}

<body>

<div class="vy-root" id="vyRoot">
  <div id="vyWelcome" class="vy-welcome-screen">

    <p>Ouvrez un fichier de voyage existant, ou créez-en un nouveau. Vos données restent en local sur votre ordinateur — rien n'est envoyé ailleurs.</p>
    <div class="vy-welcome-actions">

    </div>

        <div class="vy-filename" id="vyFileName"></div>
        <div class="vy-save-status-container" id="vySaveStatusContainer">
          <span class="vy-status-dot green" id="vyStatusDot"></span>
          <span id="vyStatusText">—</span>
          <button class="vy-save-menu-btn" id="vySaveMenuBtn" title="Menu sauvegarde">💾</button>
          <div class="vy-save-dropdown" id="vySaveDropdown">
            <button type="button" id="menuImportBtn">📥 Importer une sauvegarde</button>

</div>

<input type="file" id="vyFileInput" accept="application/json" style="display:none;">

<dialog class="vy-dialog" id="vyDialog">

      <button type="submit" class="vy-btn" id="vyDialogSubmit">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
(function(){

// ---------------------------------------------------------------- state
let tripsIndex = [];
let trips = {};
let currentTripId = null;
let currentTrip = null;
let activeTab = 'apercu';
let leafletReady = false;
let mapObj = null, markersLayer = null, routeLayer = null;
let placeMarkers = {};
let mapCenteredForTripId = null;

const CATS = { temple:'⛩ Temple/Sanctuaire', nature:'🌿 Nature', randonnee:'🥾 Randonnée', ville:'🏙 Ville/Quartier', food:'🍜 Restaurant', shopping:'🛍 Shopping', musee:'🖼 Musée', autre:'📍 Autre' };
const CAT_COLORS = { temple:'#C1401F', nature:'#4B7A4B', randonnee:'#7A5C2E', ville:'#4A5C8C', food:'#D97706', shopping:'#A6407B', musee:'#6B4FA0', autre:'#8A8D7A' };
const HOTEL_COLOR = '#B99A6B';
const TRANSIT_COLOR = '#3E6E6C';
const TRANSPORT_MODES = { train:'🚄 Train', metro:'🚇 Métro/Subway', bus:'🚌 Bus', ferry:'⛴ Ferry', voiture:'🚗 Voiture', pied:'🚶 À pied', avion:'✈ Vol interne' };
const EXPENSE_CATS = { activite:'🎟 Activités & visites', nourriture:'🍜 Nourriture', shopping:'🛍 Shopping', assurance:'🛡 Assurance & visas', divers:'💰 Divers' };
const EXPENSE_CAT_COLORS = { activite:'#6B4FA0', nourriture:'#D97706', shopping:'#A6407B', assurance:'#4A5C8C', divers:'#8A8D7A' };
const CURRENCIES = { EUR:'€ Euro', USD:'$ Dollar US', JPY:'¥ Yen japonais', GBP:'£ Livre sterling', CHF:'CHF Franc suisse' };

const root = document.getElementById('vyRoot');
const mainEl = document.getElementById('vyMainContent');
const tripListEl = document.getElementById('vyTripList');
const dialog = document.getElementById('vyDialog');
const dialogTitle = document.getElementById('vyDialogTitle');
const dialogBody = document.getElementById('vyDialogBody');
const dialogForm = document.getElementById('vyDialogForm');

const welcomeScreen = document.getElementById('vyWelcome');
const appLayout = document.getElementById('vyAppLayout');
const welNote = document.getElementById('vyWelNote');
const welResumeBtn = document.getElementById('vyWelResumeBtn');
const welRestoreCacheBtn = document.getElementById('vyWelRestoreCacheBtn');
const fileNameEl = document.getElementById('vyFileName');
const statusDot = document.getElementById('vyStatusDot');
const statusText = document.getElementById('vyStatusText');
const saveMenuBtn = document.getElementById('vySaveMenuBtn');
const saveDropdown = document.getElementById('vySaveDropdown');
const fileInput = document.getElementById('vyFileInput');

document.getElementById('vyNewTripBtn').addEventListener('click', openNewTripDialog);
const vyRootEl = document.getElementById('vyRoot');
const sidebarBackdrop = document.getElementById('vySidebarBackdrop');
function closeSidebarDrawer(){ vyRootEl.classList.remove('vy-sidebar-open'); }
document.getElementById('vyHamburgerBtn').addEventListener('click', ()=> vyRootEl.classList.toggle('vy-sidebar-open'));
sidebarBackdrop.addEventListener('click', closeSidebarDrawer);
tripListEl.addEventListener('click', (e)=>{ if(e.target.closest('[data-trip]')) closeSidebarDrawer(); });
document.getElementById('vyDialogClose').addEventListener('click', ()=>dialog.close());
document.getElementById('vyDialogCancel').addEventListener('click', ()=>dialog.close());

document.getElementById('vyWelOpenBtn').addEventListener('click', openExistingFile);
document.getElementById('vyWelNewBtn').addEventListener('click', createNewFile);
welResumeBtn.addEventListener('click', resumeRememberedHandle);
welRestoreCacheBtn.addEventListener('click', restoreFromLocalCache);
saveMenuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); saveDropdown.classList.toggle('show'); });
document.addEventListener('click', ()=> saveDropdown.classList.remove('show'));
document.getElementById('menuExportBtn').addEventListener('click', ()=>downloadCopy(buildBackupBaseName()+'.json'));
document.getElementById('menuPdfBtn').addEventListener('click', exportTripPDF);
document.getElementById('menuImportBtn').addEventListener('click', ()=>{ fileInput.dataset.mode='import'; fileInput.click(); });
document.getElementById('menuNewBtn').addEventListener('click', ()=>{
  if(confirm('Créer un projet vide ? Pensez à exporter la session actuelle avant si besoin.')) createNewFile();
});
fileInput.addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(f) handleLegacyFileSelected(f);
  e.target.value = '';
});
window.addEventListener('beforeunload', (e)=>{
  if(hasUnsavedChanges){ e.preventDefault(); e.returnValue = ''; return ''; }
});

// ---------------------------------------------------------------- helpers
let idCounter = 0;
function genId(){ idCounter++; return 'id_' + Date.now().toString(36) + '_' + idCounter.toString(36) + '_' + Math.random().toString(36).slice(2,6); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('fr-FR',{weekday:'short', day:'2-digit', month:'short'}); }
function fmtDateLong(iso){ if(!iso) return ''; const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('fr-FR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'}); }
function daysBetween(a,b){ const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00'); return Math.round((db-da)/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function todayIso(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n, currency){
  const cur = currency || (currentTrip && currentTrip.meta.currency) || 'EUR';
  if(n==null || isNaN(n)) return '—';
  try{ return Number(n).toLocaleString('fr-FR', { style:'currency', currency:cur, maximumFractionDigits: (cur==='JPY'?0:2) }); }
  catch(e){ return Number(n).toFixed(2) + ' ' + cur; }
}

function defaultTripData(meta){
  return { meta, flights:[], hotels:[], places:[], days:[], transport:[], checklist:[], expenses:[] };
}
function generateDays(trip){
  const {startDate,endDate} = trip.meta;
  if(!startDate || !endDate) return;
  const existing = {}; trip.days.forEach(d=>existing[d.date]=d);
  const n = Math.max(0, daysBetween(startDate,endDate));
  const newDays = [];
  for(let i=0;i<=n;i++){
    const date = addDays(startDate,i);
    if(existing[date]) newDays.push(existing[date]);
    else newDays.push({ id: genId(), date, label:'Jour '+(i+1), notes:'', steps:[] });
  }
  trip.days = newDays;
}
function defaultChecklist(){
  return [
    {id:genId(), category:'before', text:'Vérifier la validité du passeport (6 mois min.)', done:false},
    {id:genId(), category:'before', text:'Souscrire une assurance voyage', done:false},
    {id:genId(), category:'before', text:'Prévenir la banque du voyage / vérifier plafonds carte', done:false},
    {id:genId(), category:'before', text:'Réserver JR Pass / commander IC Card (Suica, Pasmo…)', done:false},
    {id:genId(), category:'before', text:'Télécharger les cartes hors-ligne (Google Maps)', done:false},
    {id:genId(), category:'before', text:'Souscrire un forfait data / e-SIM local', done:false},
    {id:genId(), category:'before', text:"Réserver les restaurants / attractions à l'avance", done:false},
    {id:genId(), category:'packing', text:'Adaptateur secteur (prise type A)', done:false},
    {id:genId(), category:'packing', text:'Batterie externe', done:false},
    {id:genId(), category:'packing', text:'Trousse de pharmacie de base', done:false},
    {id:genId(), category:'packing', text:'Espèces en devise locale', done:false},
  ];
}

// ---------------------------------------------------------------- persistence (local file)
const hasFS = ('showOpenFilePicker' in window && 'showSaveFilePicker' in window);
let dbHandle = null;          // FileSystemFileHandle when using the File System Access API
let fileMode = null;          // 'fsapi' | 'download'
let currentFileName = 'voyages.json';
let hasUnsavedChanges = false;
let autosaveTimer = null;
let isSessionOpen = false;
let pendingHandle = null;     // remembered handle awaiting permission before we can reopen it

// ---- remembering the last opened file across browser sessions (IndexedDB) ----
const IDB_NAME = 'vy-carnet-voyage';
const IDB_STORE = 'handles';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('indexedDB indisponible')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.warn('idbSet failed', e); return false; }
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ console.warn('idbGet failed', e); return null; }
}
async function idbDelete(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  }catch(e){ return false; }
}

// ---- lightweight local cache (covers browsers without the File System Access API,
// and acts as a safety net if a remembered file handle ever becomes unusable) ----
function cacheLocally(){
  try{
    localStorage.setItem('vy_last_payload', JSON.stringify(buildFullPayload()));
    localStorage.setItem('vy_last_filename', currentFileName);
  }catch(e){ console.warn('local cache failed', e); }
}
function restoreFromLocalCache(){
  try{
    const raw = localStorage.getItem('vy_last_payload');
    if(!raw) return;
    const data = JSON.parse(raw);
    fileMode = 'download';
    dbHandle = null;
    currentFileName = localStorage.getItem('vy_last_filename') || 'voyages.json';
    loadPayload(data);
    openApp();
    setStatus('dirty');
  }catch(e){ alert('Impossible de restaurer la session enregistrée.'); console.error(e); }
}
async function resumeRememberedHandle(){
  if(!pendingHandle) return;
  try{
    const perm = await pendingHandle.requestPermission({ mode: 'readwrite' });
    if(perm !== 'granted'){ alert("Permission refusée pour ce fichier. Utilisez « Ouvrir un fichier existant » à la place."); return; }
    const file = await pendingHandle.getFile();
    const data = JSON.parse(await file.text());
    dbHandle = pendingHandle; fileMode = 'fsapi'; currentFileName = pendingHandle.name;
    loadPayload(data);
    openApp();
    setStatus('saved');
  }catch(e){ console.error(e); alert("Impossible de rouvrir ce fichier — il a peut-être été déplacé, renommé ou supprimé."); }
}
async function checkForRememberedFile(){
  if(hasFS){
    const handle = await idbGet('lastHandle');
    if(handle){
      try{
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        if(perm === 'granted'){
          // Already authorized: reopen it immediately, no click needed.
          const file = await handle.getFile();
          const data = JSON.parse(await file.text());
          dbHandle = handle; fileMode = 'fsapi'; currentFileName = handle.name;
          loadPayload(data);
          openApp();
          setStatus('saved');
          return;
        } else {
          // Browsers require a fresh user gesture to (re)grant file permissions,
          // so we surface a one-click "Reprendre" button instead of the picker.
          pendingHandle = handle;
          welResumeBtn.textContent = '↺ Reprendre « ' + handle.name + ' »';
          welResumeBtn.style.display = 'inline-flex';
        }
      }catch(e){ console.warn('remembered handle unusable', e); idbDelete('lastHandle'); }
    }
  }
  if(!pendingHandle){
    try{
      if(localStorage.getItem('vy_last_payload')){
        const fname = localStorage.getItem('vy_last_filename') || 'voyages.json';
        welRestoreCacheBtn.textContent = '🕓 Restaurer la dernière session (' + fname + ')';
        welRestoreCacheBtn.style.display = 'inline-flex';
      }
    }catch(e){}
  }
}

function buildFullPayload(){
  return { version: 1, savedAt: new Date().toISOString(), tripsIndex, trips, currentTripId };
}
function loadPayload(data){
  tripsIndex = data.tripsIndex || [];
  trips = data.trips || {};
  Object.values(trips).forEach(t=>{
    if(!Array.isArray(t.expenses)) t.expenses = [];
    if(!t.meta.currency) t.meta.currency = 'EUR';
  });
  currentTripId = (data.currentTripId && trips[data.currentTripId]) ? data.currentTripId : (tripsIndex[0] ? tripsIndex[0].id : null);
  currentTrip = currentTripId ? trips[currentTripId] : null;
}

function setStatus(state, extra){
  statusDot.className = 'vy-status-dot ' + ({saved:'green', dirty:'orange', saving:'orange', error:'red'}[state] || 'green');
  const now = new Date().toLocaleTimeString('fr-FR');
  if(state==='saved'){ statusText.textContent = fileMode==='fsapi' ? ('Enregistré à '+now) : ('À jour dans cette session ('+now+')'); hasUnsavedChanges=false; }
  else if(state==='dirty'){ statusText.textContent = fileMode==='fsapi' ? 'Modifications non enregistrées…' : 'Non exporté — pensez à « Exporter »'; }
  else if(state==='saving'){ statusText.textContent = 'Sauvegarde…'; }
  else if(state==='error'){ statusText.textContent = extra || 'Erreur de sauvegarde'; }
}

function markDirty(){
  if(!isSessionOpen) return;
  hasUnsavedChanges = true;
  setStatus('dirty');
  cacheLocally();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(runAutosave, fileMode==='fsapi' ? 900 : 1500);
}

let autosaveInFlight = false;
let autosavePending = false;
async function runAutosave(){
  if(fileMode !== 'fsapi' || !dbHandle){
    // No File System Access API handle: we can't silently write to disk.
    // The dirty indicator stays on to remind the person to Save/Export.
    return;
  }
  if(autosaveInFlight){
    // A write is already in progress on this file handle. Starting a second
    // one concurrently can corrupt or truncate the file, so we queue this
    // request and it will run right after the current one finishes.
    autosavePending = true;
    return;
  }
  autosaveInFlight = true;
  setStatus('saving');
  try{
    const writable = await dbHandle.createWritable();
    await writable.write(JSON.stringify(buildFullPayload(), null, 2));
    await writable.close();
    setStatus('saved');
  }catch(e){
    console.error('autosave failed', e);
    setStatus('error', 'Échec de la sauvegarde automatique');
  } finally {
    autosaveInFlight = false;
    if(autosavePending){
      autosavePending = false;
      runAutosave();
    }
  }
}

function handleLegacyFileSelected(file){
  const mode = fileInput.dataset.mode || 'open';
  const reader = new FileReader();
  reader.onload = () => {
    try{

      if(mode === 'import' && isSessionOpen){

function sanitizeForFilename(s){
  return (s||'voyage')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'') || 'voyage';
}
function formatDateTimeForFilename(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'h'+pad(d.getMinutes());
}
function buildBackupBaseName(){
  const tripName = currentTrip ? currentTrip.meta.name : (tripsIndex[0] ? tripsIndex[0].name : '');
  return 'save_' + sanitizeForFilename(tripName) + '_planner_' + formatDateTimeForFilename();
}
function downloadCopy(name){
  const blob = new Blob([JSON.stringify(buildFullPayload(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------- trip CRUD
function createTrip(meta){
  const id = genId();
  if(!meta.currency) meta.currency = 'EUR';
  tripsIndex.unshift({ id, name:meta.name, country:meta.country, startDate:meta.startDate, endDate:meta.endDate });
  const data = defaultTripData(meta);
  generateDays(data);
  data.checklist = defaultChecklist();
  trips[id] = data;
  currentTripId = id;
  currentTrip = data;
  activeTab = 'apercu';
  markDirty();
  renderAll();
}
function updateTripMeta(patch){
  Object.assign(currentTrip.meta, patch);
  const idx = tripsIndex.find(t=>t.id===currentTripId);
  if(idx) Object.assign(idx, patch);
  generateDays(currentTrip);
  markDirty();
  renderAll();
}
function switchTrip(id){
  if(!trips[id]){
    console.warn('Données introuvables pour le voyage', id, '— reconstruction d\'un voyage vide pour éviter la perte d\'affichage.');
    const idx = tripsIndex.find(t=>t.id===id);
    trips[id] = defaultTripData(idx ? { name: idx.name, country: idx.country, startDate: idx.startDate, endDate: idx.endDate } : {});
    generateDays(trips[id]);
    trips[id].checklist = defaultChecklist();
    markDirty();
  }
  currentTripId = id;
  currentTrip = trips[id];
  activeTab = 'apercu';
  hiddenCats = new Set();
  selectedPlaceId = null;
  apercuSelectedDayId = null;
  renderAll();
}
function deleteCurrentTrip(){
  if(!confirm('Supprimer définitivement ce voyage et toutes ses données ?')) return;
  delete trips[currentTripId];
  tripsIndex = tripsIndex.filter(t=>t.id!==currentTripId);
  currentTripId = tripsIndex.length ? tripsIndex[0].id : null;
  currentTrip = currentTripId ? trips[currentTripId] : null;
  markDirty();
  renderAll();
}


// ---------------------------------------------------------------- generic item CRUD
function addItem(listName, obj){
  obj.id = genId();
  currentTrip[listName].push(obj);
  markDirty();
  renderAll();
}
function updateItem(listName, id, patch){
  const item = currentTrip[listName].find(x=>x.id===id);
  if(item) Object.assign(item, patch);
  markDirty();
  renderAll();
}
function deleteItem(listName, id){
  currentTrip[listName] = currentTrip[listName].filter(x=>x.id!==id);
  // clean references in day steps
  if(listName==='places' || listName==='transport'){
    currentTrip.days.forEach(d=> d.steps = d.steps.filter(s => !(s.type===(listName==='places'?'place':'transport') && s.ref===id)));
  }
  markDirty();
  renderAll();
}

// ---------------------------------------------------------------- geocoding
async function geocode(query){
  if(!query) return null;
  try{
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
    const data = await res.json();
    if(data && data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), label: data[0].display_name };
  }catch(e){ console.warn('geocode failed', e); }
  return null;
}

const MONTHS_FR = {janvier:1,février:2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,aout:8,septembre:9,octobre:10,novembre:11,décembre:12,decembre:12};
const MONTHS_EN = {jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
function pad2(n){ return String(n).padStart(2,'0'); }
function normalizeDateToken(raw){
  if(!raw) return null;
  let m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){ return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`; }
  m = raw.match(/^(\d{1,2})\s+([A-Za-zéûôàè]+)\.?\s+(\d{4})$/);
  if(m){
    const key = m[2].toLowerCase();
    const mo = MONTHS_FR[key] || MONTHS_EN[key];
    if(mo) return `${m[3]}-${pad2(mo)}-${pad2(m[1])}`;
  }
  return null;
}
function findDates(text){
  const found = [];
  const regexes = [
    /\b\d{4}-\d{2}-\d{2}\b/g,
    /\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{4}\b/g,
    /\b\d{1,2}\s+[A-Za-zéûôàè]+\.?\s+\d{4}\b/g
  ];
  regexes.forEach(re=>{
    for(const m of text.matchAll(re)){
      const norm = normalizeDateToken(m[0]);
      if(norm && !found.includes(norm)) found.push(norm);
    }
  });
  return found;
}
function findTimes(text){
  const found = [];
  for(const m of text.matchAll(/\b([01]?\d|2[0-3])[:hH]([0-5]\d)\b/g)){
    const t = `${pad2(m[1])}:${m[2]}`;
    found.push(t);
  }
  return found;
}
function parseFlightText(text){
  const result = { airline:'', flightNumber:'', confirmation:'', depCity:'', depAirport:'', depDatetime:'', arrCity:'', arrAirport:'', arrDatetime:'' };
  if(!text) return result;

  for(const name of AIRLINE_NAMES){ if(text.toLowerCase().includes(name.toLowerCase())){ result.airline = name; break; } }

  const fnMatch = text.match(/\b([A-Z]{2})\s?-?\s?(\d{1,4})\b(?!\d)/);
  if(fnMatch) result.flightNumber = fnMatch[1] + fnMatch[2];

  const pnrMatch = text.match(/(?:PNR|r[ée]f[ée]rence(?:\s+de)?\s+r[ée]servation|booking\s+reference|confirmation\s+(?:code|number)|code\s+de\s+r[ée]servation)\s*[:\s]\s*([A-Z0-9]{5,8})/i);
  if(pnrMatch) result.confirmation = pnrMatch[1].toUpperCase();

  const codeMatches = [];
  for(const m of text.matchAll(/\b[A-Z]{3}\b/g)){
    if(AIRPORTS[m[0]] && !codeMatches.includes(m[0])) codeMatches.push(m[0]);
  }
  if(codeMatches[0]){ result.depAirport = codeMatches[0]; result.depCity = AIRPORTS[codeMatches[0]]; }
  if(codeMatches[1]){ result.arrAirport = codeMatches[1]; result.arrCity = AIRPORTS[codeMatches[1]]; }

  const dates = findDates(text);
  const times = findTimes(text);
  const depDate = dates[0] || '';
  const arrDate = dates[1] || dates[0] || '';
  const depTime = times[0] || '';
  const arrTime = times[1] || '';
  if(depDate && depTime) result.depDatetime = `${depDate}T${depTime}`;
  if(arrDate && arrTime) result.arrDatetime = `${arrDate}T${arrTime}`;

  return result;
}

      <div class="vy-map-side">
        ${usedCats.length ? `<div class="vy-map-legend">${usedCats.map(cat=>{

  `;
  document.getElementById('vyAddPlace').addEventListener('click', ()=>openPlaceDialog(null));

  c.querySelectorAll('[data-del-place]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); deleteItem('places', b.getAttribute('data-del-place')); }));
  c.querySelectorAll('[data-cat-filter]').forEach(btn=>btn.addEventListener('click', ()=>{
    const cat = btn.getAttribute('data-cat-filter');
    if(hiddenCats.has(cat)) hiddenCats.delete(cat); else hiddenCats.add(cat);
    renderLieux(c);
  }));
  c.querySelectorAll('[data-place-row]').forEach(row=>row.addEventListener('click', (e)=>{
    if(e.target.closest('.vy-step-actions')) return;
    focusPlaceOnMap(row.getAttribute('data-place-row'));
  }));
  ensureLeaflet().then(drawMap);
}
function focusPlaceOnMap(id){
  selectedPlaceId = id;

  if(marker) marker.openPopup();

// ---------------------------------------------------------------- ITINERAIRE
function renderItineraire(c){
  const t = currentTrip;
  if(!t.meta.startDate || !t.meta.endDate){
    c.innerHTML = '<div class="vy-empty-hint">Renseignez les dates de début et de fin du voyage (bouton "Modifier" en haut) pour générer les journées.</div>';
    return;
  }
  c.innerHTML = `<div class="vy-section-head"><h3>Itinéraire jour par jour</h3></div>` + t.days.map(d=>dayBlock(d)).join('');
  c.querySelectorAll('[data-add-step]').forEach(b=>b.addEventListener('click', ()=>openStepDialog(b.getAttribute('data-add-step'))));
  c.querySelectorAll('[data-del-step]').forEach(b=>b.addEventListener('click', ()=>{
    const [dayId, stepId] = b.getAttribute('data-del-step').split('|');
    const day = t.days.find(x=>x.id===dayId);
    day.steps = day.steps.filter(s=>s.id!==stepId);
    markDirty();
    renderAll();
  }));
  c.querySelectorAll('[data-move-step]').forEach(b=>b.addEventListener('click', ()=>{
    const [dayId, stepId, dir] = b.getAttribute('data-move-step').split('|');
    const day = t.days.find(x=>x.id===dayId);
    const idx = day.steps.findIndex(s=>s.id===stepId);
    const swap = dir==='up' ? idx-1 : idx+1;
    if(swap<0 || swap>=day.steps.length) return;
    [day.steps[idx], day.steps[swap]] = [day.steps[swap], day.steps[idx]];
    markDirty();
    renderAll();
  }));
  c.querySelectorAll('[data-day-notes]').forEach(ta=>ta.addEventListener('change', ()=>{
    const day = t.days.find(x=>x.id===ta.getAttribute('data-day-notes'));
    day.notes = ta.value;
    markDirty();
  }));
  c.querySelectorAll('[data-day-label]').forEach(inp=>inp.addEventListener('change', ()=>{
    const day = t.days.find(x=>x.id===inp.getAttribute('data-day-label'));
    day.label = inp.value || day.label;
    markDirty();
    renderAll();
  }));
}
function stepLine(day, s){
  let icon='📝', content='', sub='';
  if(s.type==='place'){ const p = currentTrip.places.find(x=>x.id===s.ref); icon=(CATS[p&&p.category]||CATS.autre).split(' ')[0]; content = p?p.name:'(lieu supprimé)'; sub = p&&p.notes||''; }
  else if(s.type==='transport'){ const tr = currentTrip.transport.find(x=>x.id===s.ref); icon=(TRANSPORT_MODES[tr&&tr.mode]||'🚉').split(' ')[0]; content = tr?(tr.fromName+' → '+tr.toName):'(trajet supprimé)'; sub = tr?(tr.line||''):''; }
  else { content = s.text||''; }
  return `<div class="vy-step">
    <span class="steptype">${icon}</span>
    <div class="stepcontent">${esc(content)}${sub?'<div class="stepsub">'+esc(sub)+'</div>':''}</div>
    <div class="vy-step-actions">
      <button class="vy-iconbtn" data-move-step="${day.id}|${s.id}|up">↑</button>
      <button class="vy-iconbtn" data-move-step="${day.id}|${s.id}|down">↓</button>
      <button class="vy-iconbtn" data-del-step="${day.id}|${s.id}">✕</button>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- BUDGET
function computeBudgetTotals(){
  const t = currentTrip;
  const flights = t.flights.reduce((s,f)=>s+(Number(f.price)||0),0);
  const hotels = t.hotels.reduce((s,h)=>s+(Number(h.price)||0),0);
  const transport = t.transport.reduce((s,tr)=>s+(Number(tr.price)||0),0);
  const byExpenseCat = {};
  Object.keys(EXPENSE_CATS).forEach(k=>byExpenseCat[k]=0);
  t.expenses.forEach(e=>{ byExpenseCat[e.category] = (byExpenseCat[e.category]||0) + (Number(e.amount)||0); });
  const expensesTotal = Object.values(byExpenseCat).reduce((a,b)=>a+b,0);
  const categories = [
    { key:'vols', label:'✈ Vols', amount: flights, color:'var(--vermilion)' },
    { key:'hotels', label:'🏨 Hôtels', amount: hotels, color:'var(--kraft)' },
    { key:'transport', label:'🚉 Transport sur place', amount: transport, color:'var(--transit)' },
    ...Object.entries(EXPENSE_CATS).map(([k,label])=>({ key:k, label, amount: byExpenseCat[k], color: EXPENSE_CAT_COLORS[k] }))
  ];
  const grandTotal = flights + hotels + transport + expensesTotal;
  return { flights, hotels, transport, expensesTotal, categories, grandTotal };
}
function renderBudget(c){
  const t = currentTrip;
  const cur = t.meta.currency || 'EUR';
  const { categories, grandTotal } = computeBudgetTotals();
  const target = t.meta.budgetTarget;
  const maxCat = Math.max(1, ...categories.map(x=>x.amount));
  const remaining = target!=null ? target - grandTotal : null;
  const nights = t.hotels.reduce((s,h)=> s + ((h.checkin&&h.checkout)?Math.max(0,daysBetween(h.checkin,h.checkout)):0), 0);
  const tripDays = t.days.length || null;

  const sortedExpenses = [...t.expenses].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  c.innerHTML = `
    <div class="vy-stats">
      <div class="vy-stat"><div class="n">${fmtMoney(grandTotal, cur)}</div><div class="l">Total dépensé</div></div>
      ${target!=null ? `
      <div class="vy-stat"><div class="n">${fmtMoney(target, cur)}</div><div class="l">Budget prévisionnel</div></div>
      <div class="vy-stat" style="${remaining<0?'border-color:var(--danger);':''}"><div class="n" style="${remaining<0?'color:var(--danger);':''}">${remaining<0?'−':''}${fmtMoney(Math.abs(remaining), cur)}</div><div class="l">${remaining<0?'Dépassement':'Restant'}</div></div>
      ` : `<div class="vy-stat" id="vySetBudgetTarget" style="cursor:pointer;"><div class="n" style="font-size:16px;color:var(--ink-soft);">+ Définir</div><div class="l">Budget prévisionnel</div></div>`}
      ${tripDays ? `<div class="vy-stat"><div class="n">${fmtMoney(grandTotal/tripDays, cur)}</div><div class="l">Par jour de voyage</div></div>` : ''}
    </div>

    <div class="vy-section-head"><h3>Répartition par catégorie</h3></div>
    <div class="vy-budget-bars">
      ${categories.filter(cat=>cat.amount>0 || true).map(cat=>`
        <div class="vy-budget-row">
          <div class="vy-budget-row-label">${cat.label}</div>
          <div class="vy-budget-row-bar"><div style="width:${grandTotal>0?Math.max(2,Math.round(cat.amount/maxCat*100)):0}%;background:${cat.color}"></div></div>
          <div class="vy-budget-row-amount">${fmtMoney(cat.amount, cur)}</div>
        </div>
      `).join('')}
    </div>

    <div class="vy-section-head" style="margin-top:24px;"><h3>Dépenses annexes</h3><button class="vy-btn small" id="vyAddExpense">+ Ajouter une dépense</button></div>
    <p style="color:var(--ink-soft);font-size:12px;margin:-8px 0 14px;">Activités, restaurants, shopping… Les vols, hôtels et trajets se renseignent directement dans leurs onglets respectifs.</p>
    ${sortedExpenses.length ? '<div class="vy-expense-list">'+sortedExpenses.map(expenseRow).join('')+'</div>' : '<div class="vy-empty-hint">Aucune dépense annexe enregistrée.</div>'}
  `;

  const setBtn = document.getElementById('vySetBudgetTarget');
  if(setBtn) setBtn.addEventListener('click', openEditTripDialog);
  document.getElementById('vyAddExpense').addEventListener('click', ()=>openExpenseDialog(null));
  c.querySelectorAll('[data-edit-expense]').forEach(b=>b.addEventListener('click', ()=>openExpenseDialog(b.getAttribute('data-edit-expense'))));
  c.querySelectorAll('[data-del-expense]').forEach(b=>b.addEventListener('click', ()=>deleteItem('expenses', b.getAttribute('data-del-expense'))));
}
function expenseRow(e){
  return `<div class="vy-expense-row">

// ---------------------------------------------------------------- CHECKLIST
function renderChecklist(c){
  const t = currentTrip;
  function col(cat, title){
    const items = t.checklist.filter(x=>x.category===cat);
    const done = items.filter(x=>x.done).length;
    const pct = items.length ? Math.round(done/items.length*100) : 0;
    return `<div class="vy-checklist-col">
      <h4>${title}</h4>
      <div class="vy-progress"><div style="width:${pct}%"></div></div>
      ${items.map(it=>`<div class="vy-check-item ${it.done?'done':''}">
        <input type="checkbox" data-check="${it.id}" ${it.done?'checked':''}>
        <span class="txt">${esc(it.text)}</span>
        <button class="vy-iconbtn" data-del-check="${it.id}">✕</button>
      </div>`).join('')}
      <form class="vy-checkform" data-add-check="${cat}">
        <input name="text" placeholder="Ajouter un élément…" required>
        <button class="vy-btn small" type="submit">+</button>
      </form>
    </div>`;
  }
  c.innerHTML = `<div class="vy-section-head"><h3>Check-list</h3></div>
  <div class="vy-checklist-cols">${col('before','Avant le départ (démarches)')}${col('packing','Bagages')}</div>`;
  c.querySelectorAll('[data-check]').forEach(cb=>cb.addEventListener('change', ()=>updateItem('checklist', cb.getAttribute('data-check'), {done: cb.checked})));
  c.querySelectorAll('[data-del-check]').forEach(b=>b.addEventListener('click', ()=>deleteItem('checklist', b.getAttribute('data-del-check'))));
  c.querySelectorAll('[data-add-check]').forEach(f=>f.addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(f);
    const text = fd.get('text');
    if(!text) return;
    addItem('checklist', { category: f.getAttribute('data-add-check'), text, done:false });
  }));
}

// ---------------------------------------------------------------- LEAFLET MAP
function ensureLeaflet(){
  if(window.L){ leafletReady = true; return Promise.resolve(); }
  return new Promise((resolve)=>{
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    script.onload = ()=>{ leafletReady = true; resolve(); };
    script.onerror = ()=> resolve();
    document.head.appendChild(script);
  });
}

// ---------------------------------------------------------------- PDF.js (billet import)
function ensurePdfJs(){
  if(window.pdfjsLib){ return Promise.resolve(true); }
  return new Promise((resolve)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js';
    script.onload = ()=>{
      try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js'; }catch(e){}
      resolve(true);
    };
    script.onerror = ()=> resolve(false);
    document.head.appendChild(script);
  });
}
async function extractPdfText(file){
  const ok = await ensurePdfJs();
  if(!ok || !window.pdfjsLib) throw new Error('pdfjs-unavailable');
  const buf = await file.arrayBuffer();
  const doc = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for(let i=1; i<=doc.numPages; i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
function drawMap(){
  const mapDiv = document.getElementById('vy-leaflet-map');
  if(!mapDiv) return;
  if(!window.L){ mapDiv.innerHTML = '<div class="vy-loading">Carte indisponible (chargement impossible).</div>'; return; }
  // Each tab re-render replaces the map container with a fresh DOM node.
  // If the previous Leaflet instance is bound to a now-detached node, tear it down first.
  if(mapObj && mapObj.getContainer && mapObj.getContainer() !== mapDiv){
    try{ mapObj.remove(); }catch(e){}
    mapObj = null; markersLayer = null; routeLayer = null;
  }
  const isNewMapInstance = !mapObj;
  if(!mapObj){
    mapObj = L.map(mapDiv, { attributionControl: true }).setView([35.68, 139.76], 6);
    // CARTO's basemap tiles work reliably in sandboxed/embedded contexts (no strict referer requirement),
    // unlike the raw OpenStreetMap tile servers which return 403 without a proper referer header.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(mapObj);
    markersLayer = L.layerGroup().addTo(mapObj);
    routeLayer = L.layerGroup().addTo(mapObj);
  } else {
    mapObj.invalidateSize();
  }
  markersLayer.clearLayers();
  routeLayer.clearLayers();
  placeMarkers = {};
  const t = currentTrip;
  const bounds = [];
  const dotIcon = (color)=> L.divIcon({ className:'', html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 0 1px ${color};"></div>`, iconSize:[14,14] });

  t.places.forEach(p=>{
    if(hiddenCats.has(p.category||'autre')) return;
    if(p.lat && p.lng){
      const color = CAT_COLORS[p.category] || CAT_COLORS.autre;
      const marker = L.marker([p.lat,p.lng], {icon: dotIcon(color)}).addTo(markersLayer).bindPopup(`<b>${(CATS[p.category]||CATS.autre).split(' ')[0]} ${esc(p.name)}</b><br>${esc(p.notes||'')}`);
      placeMarkers[p.id] = marker;
      bounds.push([p.lat,p.lng]);
    }
  });
  t.hotels.forEach(h=>{ if(h.lat && h.lng){ L.marker([h.lat,h.lng], {icon: dotIcon(HOTEL_COLOR)}).addTo(markersLayer).bindPopup(`<b>🏨 ${esc(h.name)}</b><br>${esc(h.address||'')}`); bounds.push([h.lat,h.lng]); } });
  t.transport.forEach(tr=>{
    if(tr.fromLat && tr.fromLng){ L.marker([tr.fromLat,tr.fromLng], {icon: dotIcon(TRANSIT_COLOR)}).addTo(markersLayer).bindPopup(`<b>${esc(tr.fromName)}</b>`); bounds.push([tr.fromLat,tr.fromLng]); }
    if(tr.toLat && tr.toLng){ L.marker([tr.toLat,tr.toLng], {icon: dotIcon(TRANSIT_COLOR)}).addTo(markersLayer).bindPopup(`<b>${esc(tr.toName)}</b>`); bounds.push([tr.toLat,tr.toLng]); }
  });

  // overlay of the day-by-day itinerary paths (dashed, transport legs only —
  // "lieux à visiter" are shown as markers but are not connected by a line)
  t.days.forEach(d=>{
    d.steps.forEach(s=>{
      if(s.type==='transport'){
        const tr = t.transport.find(x=>x.id===s.ref);
        if(tr && tr.fromLat && tr.fromLng && tr.toLat && tr.toLng){
          L.polyline([[tr.fromLat,tr.fromLng],[tr.toLat,tr.toLng]], {color:'#C1401F', weight:3, dashArray:'6 4', opacity:.8}).addTo(routeLayer);
        }
      }
    });
  });


  const tripCountry = t.meta && t.meta.country;
  if(bounds.length){
    mapObj.fitBounds(bounds, {padding:[30,30]});
    mapCenteredForTripId = currentTripId;
  } else if((isNewMapInstance || mapCenteredForTripId !== currentTripId) && tripCountry){
    // No places/hotels/transport plotted yet: recenter the map on the trip's country
    // instead of leaving it on the previous default (or the previous trip's) location.
    const tripIdAtRequest = currentTripId;
    mapCenteredForTripId = tripIdAtRequest;
    geocode(tripCountry).then(g=>{
      if(g && mapObj && currentTripId === tripIdAtRequest){
        mapObj.setView([g.lat, g.lng], 6);
      }
    });
  }
}
